name: contrib-aquarium
description: Generate a living SVG aquarium from a GitHub contribution graph
author: webywz
branding:
  icon: droplet
  color: blue
inputs:
  user:
    description: GitHub login to visualize
    required: true
  out:
    description: Path for the generated SVG, relative to the caller workspace
    required: false
    default: aquarium.svg
  source:
    description: "Activity source: auto, graphql, events, or mock"
    required: false
    default: auto
  theme:
    description: "Color theme: deep, reef, or midnight"
    required: false
    default: deep
  width:
    description: "SVG display width in px (default 860); viewBox stays proportional"
    required: false
    default: ""
  height:
    description: "SVG display height in px (default: proportional to width)"
    required: false
    default: ""
  token:
    description: GitHub token used for GraphQL (defaults to the workflow token)
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Install contrib-aquarium
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci
    - name: Build
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm run build
    - name: Generate aquarium
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        ARGS=(
          generate
          --user "${{ inputs.user }}"
          --out "${{ github.workspace }}/${{ inputs.out }}"
          --source "${{ inputs.source }}"
          --theme "${{ inputs.theme }}"
        )
        if [ -n "${{ inputs.width }}" ]; then
          ARGS+=(--width "${{ inputs.width }}")
        fi
        if [ -n "${{ inputs.height }}" ]; then
          ARGS+=(--height "${{ inputs.height }}")
        fi
        node "${{ github.action_path }}/dist/cli.js" "${ARGS[@]}"
